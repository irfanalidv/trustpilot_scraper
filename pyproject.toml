[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustpilot_scraper"
version = "1.0.0"
description = "Scrape public Trustpilot company reviews into plain Python dicts, CSV or JSON, using the page's embedded __NEXT_DATA__ JSON."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = [
    "trustpilot",
    "reviews",
    "scraper",
    "web-scraping",
    "customer-reviews",
    "sentiment-analysis",
    "review-analysis",
    "market-research",
    "competitor-analysis",
    "nextjs",
    "beautifulsoup",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.17.0",
    "mypy>=1.10",
    "types-requests",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
trustpilot-scraper = "trustpilot_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/irfanalidv/trustpilot_scraper"
Documentation = "https://github.com/irfanalidv/trustpilot_scraper#readme"
Repository = "https://github.com/irfanalidv/trustpilot_scraper"
Issues = "https://github.com/irfanalidv/trustpilot_scraper/issues"
Changelog = "https://github.com/irfanalidv/trustpilot_scraper/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["trustpilot_scraper*"]

[tool.setuptools.package-data]
trustpilot_scraper = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "RET", "PIE"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["trustpilot_scraper"]
