name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: trustpilot_scraper version
      placeholder: "python -c 'import importlib.metadata as m; print(m.version(\"trustpilot_scraper\"))'"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12 on macOS 15"
  - type: textarea
    id: logs
    attributes:
      label: Traceback / logs
      render: text
